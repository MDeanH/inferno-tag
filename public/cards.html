<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards · Inferno Tag</title><link rel="stylesheet" href="/style.css?v=1792354165">
<style>body{background:#fff;color:#000} .sheet{padding:10px}</style></head>
<body>
<div class="noprint" style="padding:16px;text-align:center"><button class="btn" style="width:auto;display:inline-block" onclick="print()">Print 20 cards (2 per page)</button><p style="color:#444">ArUco 4x4, IDs 1–20, 12 cm. Pin or tape one to each player's chest, marker facing out, nothing covering it.</p></div>
<div class="sheet" id="sheet"></div>
<script src="/vendor/cv.js?v=1792354165"></script><script src="/vendor/aruco.js?v=1792354165"></script><script src="/vendor/aruco_4x4_1000.js?v=1792354165"></script><script src="/app.js?v=1792354165"></script>
<script>
const dict = new AR.Dictionary('ARUCO_4X4_1000');
Inferno.api('/api/state').then(s => {
  const u = Inferno.gameUrl(s); const sheet = document.getElementById('sheet');
  for (let i = 1; i <= 20; i++) { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = `${dict.generateSVG(i)}<div class="num">${i}</div><p>Inferno Tag · pin me on your chest</p><p>Wi-Fi <b>LAB Events</b> · join at <b>${u}</b> · card <b>${i}</b></p>`; sheet.appendChild(d); }
});
</script></body></html>
