<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join · Inferno Tag</title><link rel="stylesheet" href="/style.css?v=1792354165"></head>
<body><main>
  <h1 class="logo"><span class="flame">🔥</span> INFERNO <em>TAG</em></h1><div class="sub">Devin's Inferno · Miami</div>
  <h2 style="margin:0 0 4px">Join the fight</h2>
  <p>Pin a card on your chest, then pick that card's number here.</p>
  <label for="name">Your name</label>
  <input id="name" type="text" maxlength="16" autocomplete="off" placeholder="e.g. Mike">
  <label>Your card number</label>
  <div class="cards" id="cards"></div>
  <button class="btn" id="join">Join</button>
  <div class="err" id="err"></div>
  <p class="small" id="status"></p>
</main>
<script src="/app.js?v=1792354165"></script>
<script>
(async () => {
  if (Inferno.token()) { const r = await Inferno.api('/api/heartbeat', { token: Inferno.token() }); if (r.ok) { location.replace('/play'); return; } Inferno.setToken(''); }
  const COLORS = ['#ff6a2a','#6fe08a','#5ac8fa','#ffd166','#ff5fa2','#c792ea','#ffa94d','#4dd4ac','#f78da7','#8ab4f8','#ffe066','#7bed9f','#ff7f50','#70a1ff','#eccc68','#7efff5','#ff6b81','#a4b0be','#2ed573','#ffa502'];
  const cardsEl = document.getElementById('cards'); let sel = 0, taken = new Set();
  const render = () => { cardsEl.innerHTML = ''; for (let i = 1; i <= 20; i++) { const b = document.createElement('button'); b.textContent = i; b.style.setProperty('--c', COLORS[(i - 1) % 20]); b.disabled = taken.has(i); b.className = sel === i ? 'sel' : ''; b.onclick = () => { sel = i; render(); }; cardsEl.appendChild(b); } };
  Inferno.events(s => { taken = new Set(s.players.filter(p => p.online).map(p => p.card)); render(); document.getElementById('status').textContent = `${s.players.length} player(s) · ${s.state.toUpperCase()}`; });
  render();
  document.getElementById('join').onclick = async () => {
    const err = document.getElementById('err'); err.textContent = '';
    const name = document.getElementById('name').value.trim(); if (!name) return err.textContent = 'Type your name';
    if (!sel) return err.textContent = 'Pick your card number';
    const r = await Inferno.api('/api/join', { name, card: sel });
    if (r.error) return err.textContent = r.error;
    Inferno.setToken(r.token); Inferno.sounds.respawn(); location.href = '/play';
  };
})();
</script></body></html>
